<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>atelier hana</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Noto+Sans+JP:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <header>
        <h1>atelier hana</h1>
        <nav>
            <ul>
                <li><a href="#hero">HOME</a></li>
                <li><a href="#concept">CONCEPT</a></li>
                <li><a href="#item">ITEM</a></li>
                <li><a href="#instagram">INSTAGRAM</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="hero" id="hero">
            <h2>「手のひらに、小さな幸せを。」</h2>
        </section>
        <section class="concept" id="concept">
            <h3>CONCEPT</h3>
            <p>atelier hanaは、日常に寄り添うハンドメイドアクセサリーのショップです。<br>
            ひとつひとつ丁寧に手作りした作品が、<br>
            あなたの毎日を<span>ちょっと特別</span>にしてくれますように。</p>
        </section>
        <section class="item" id="item">
            <h3>ITEM</h3>
            <div class="item-grid">
                <div class="item-card">
                    <img src="images/item1_earrings.png" alt="ピアス" width="200" height="200">
                    <p>Earrings</p>
                </div>
                <div class="item-card">
                    <img src="images/item2_necklace.png" alt="ネックレス" width="200" height="200">
                    <p>Necklace</p>
                </div>
                <div class="item-card">
                    <img src="images/item3_bracelet.png" alt="ブレスレット" width="200" height="200">
                    <p>Bracelet</p>
                </div>
                <div class="item-card">
                    <img src="images/item4_ring.png" alt="リング" width="200" height="200">
                    <p>Ring</p>
                </div>
            </div>
        </section>
        <section class="instagram" id="instagram">
            <h3>INSTAGRAM</h3>
            <div class="insta-grid">
             <img src="https://placehold.jp/300x300.png" alt="Instagram投稿">
             <img src="https://placehold.jp/300x300.png" alt="Instagram投稿">
             <img src="https://placehold.jp/300x300.png" alt="Instagram投稿">
             <img src="https://placehold.jp/300x300.png" alt="Instagram投稿">
             <img src="https://placehold.jp/300x300.png" alt="Instagram投稿">
             <img src="https://placehold.jp/300x300.png" alt="Instagram投稿">
            </div>
            <div class="insta-btn">
                <a class="btn" href="#">
                 <i class="fa-brands fa-instagram"></i> INSTAGRAMへ
                </a>
            </div>
        </section>
        
    </main>
    <footer>
    <p>© 2024 atelier hana</p>
    </footer>
</body>
</html>
